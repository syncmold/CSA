name: CI

# Only pull requests: a PR run already tests its merge with main, so re-running the same tree after the merge
# lands on main costs minutes for nothing. Docs-only changes skip CI.
# The same RLS tests on the Supabase local stack are in supabase-compat.yml, which runs only when the database side
# changes (#215).
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

env:
  POSTGREST_VERSION: v16.4

jobs:
  postgres-postgrest:
    name: typecheck, unit, RLS and e2e on Postgres + PostgREST (Q76)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Download PostgREST
        run: |
          curl -sSL -o postgrest.tar.xz \
            "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x86-64.tar.xz"
          tar -xJf postgrest.tar.xz
          chmod +x ./postgrest
          ./postgrest --help | head -n 1

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's#^POSTGREST_BIN=.*#POSTGREST_BIN=./postgrest#' .env

      - name: Create database, role and apply migrations
        run: |
          npm run db:init
          npm run db:migrate

      - name: Start PostgREST
        run: |
          npm run db:start &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/ >/dev/null

      - name: RLS tests (Vitest against PostgREST)
        run: npm run test:db

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # 主線驗收（#8）要上面那個 PostgREST：它自己建廠區、流程與測試年度，以換證拿到的 session 輪流扮演各關簽核人。
      - name: E2E (Playwright, incl. the main-flow acceptance against PostgREST)
        run: npm run test:e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
