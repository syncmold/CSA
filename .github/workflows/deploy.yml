name: Deploy

# 手動部署：到 Actions → Deploy → Run workflow，選 test 或 prod。
# 設定放在 GitHub 的 Environments（test、production 各一組 secrets），不放在任何人的電腦。
# 組織是免費方案時，私有 repo 不能設 Environment 的 Required reviewers，所以改用變數 PROD_DEPLOYERS（GitHub 帳號，逗號分隔）
# 當部署 prod 的白名單。升級到 Team 方案後建議改用 Required reviewers，再把下面「確認部署者」那一步拿掉。
# 這份是草稿：還沒有在組織 repo 實際跑過，第一次請先用 test 驗證（見 docs/部署與切換手冊.md）。
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 要部署的環境
        type: choice
        options: [test, prod]
        required: true
      steps:
        description: 部署步驟（日常用 update；第一次建環境用 all）
        type: choice
        options: [update, all, check]
        default: update

permissions:
  contents: read

jobs:
  deploy:
    name: deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Environment 名稱：test → test，prod → production
    environment: ${{ inputs.environment == 'prod' && 'production' || 'test' }}
    concurrency: deploy-${{ inputs.environment }}
    steps:
      - name: 確認部署者（prod 只有 PROD_DEPLOYERS 名單上的人能部署）
        if: inputs.environment == 'prod'
        env:
          ACTOR: ${{ github.actor }}
          ALLOWED: ${{ vars.PROD_DEPLOYERS }}
        run: |
          if [ -z "$ALLOWED" ]; then echo "production Environment 沒有設定變數 PROD_DEPLOYERS，拒絕部署"; exit 1; fi
          if ! echo ",${ALLOWED// /}," | grep -qi ",${ACTOR},"; then echo "$ACTOR 不在 PROD_DEPLOYERS 名單上，拒絕部署"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy
        run: npm run deploy -- ${{ inputs.environment }} ${{ inputs.steps }}
        env:
          # 資料庫與換證（secrets）
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CSA_JWT_SECRET: ${{ secrets.CSA_JWT_SECRET }}
          OMS_CHANNEL_KEY: ${{ secrets.OMS_CHANNEL_KEY }}
          # 部署工具的登入（secrets）
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # 非機密設定（variables）
          CSA_SITE_URL: ${{ vars.CSA_SITE_URL }}
          CSA_VERCEL_PROJECT: ${{ vars.CSA_VERCEL_PROJECT }}
          CSA_REQUIRE_OMS_AUTH: ${{ vars.CSA_REQUIRE_OMS_AUTH }}
          VITE_OMS_URL: ${{ vars.VITE_OMS_URL }}
          VITE_OMS_ANON_KEY: ${{ vars.VITE_OMS_ANON_KEY }}
          # 第一次初始化才需要（all／seed）
          CSA_SEED_AUDIT_CHIEF: ${{ vars.CSA_SEED_AUDIT_CHIEF }}
          CSA_SEED_MAINTAINERS: ${{ vars.CSA_SEED_MAINTAINERS }}
          CSA_SEED_ALLOWLIST: ${{ vars.CSA_SEED_ALLOWLIST }}
